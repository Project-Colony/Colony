name: CI

# A newer push to the same PR obsoletes the running build: cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]

# Read-only by default. A job that needs more asks for it by name.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned to master with `toolchain: stable` rather than to the `stable`
      # branch: that branch is rebased onto every master commit, so a SHA
      # pinned on it stops being reachable from any branch. Bumped by hand.
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --all -- --check

      # --all-targets, or clippy never sees the tests - the code most
      # likely to accumulate lint debt, since nobody reads it in review.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --verbose

      # SignPath signs only an .exe whose ProductName is the project name and
      # whose ProductVersion is set. build.rs embeds both; this proves it on
      # every PR, and the release workflow checks the shipped file again.
      # `-cne`, not `-ne`: PowerShell compares strings case-insensitively, and
      # winresource's default ProductName is the lowercase package name.
      - name: Check the Windows version resource
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $expected = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          $info = (Get-Item target\debug\colony.exe).VersionInfo
          "ProductName='$($info.ProductName)' ProductVersion='$($info.ProductVersion)' FileVersion='$($info.FileVersion)'"
          if ($info.ProductName -cne 'Colony' -or $info.ProductVersion -cne $expected) {
            "::error::colony.exe has ProductName '$($info.ProductName)' and ProductVersion '$($info.ProductVersion)', expected 'Colony' and '$expected'"
            exit 1
          }

  # The declared MSRV was 1.80 for years and could never have built: 70
  # transitive dependencies require more. Nothing checked it, because CI only
  # ever ran on stable. This leg is what stops it drifting again.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the declared MSRV
        id: msrv
        run: |
          version=$(grep '^rust-version' Cargo.toml | tr -d ' "' | cut -d= -f2)
          [ -n "$version" ] || { echo "::error::could not read rust-version from Cargo.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: msrv-${{ steps.msrv.outputs.version }}

      - name: Build on the declared floor
        run: cargo check --locked --all-targets

  # Colony downloads and executes binaries, so a known-vulnerable dependency is
  # not an abstract concern. This job GATES: red here means something new and
  # actionable.
  #
  # It gates because the alternative does not work. Left to report without
  # gating, it is red on every single PR forever - and a check that is always
  # red is a check nobody reads. So the advisories that genuinely cannot be
  # acted on from this repository are ignored BY ID, with the reason written
  # down, and everything else fails the build.
  #
  # RUSTSEC-2026-0194 / RUSTSEC-2026-0195 (quick-xml): held at 0.38 by
  # wayland-scanner, via winit and iced 0.14 - a semver-incompatible bump we
  # cannot make from here. Both advisories concern parsing untrusted XML;
  # wayland-scanner is a build-time proc-macro that parses the system's own
  # Wayland protocol descriptions, so neither is reachable at runtime.
  # Remove these two the day iced ships a winit new enough to carry
  # quick-xml >= 0.41.
  audit:
    name: Advisories
    runs-on: ubuntu-latest
    # audit-check reports the advisories as a check run.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ignore: RUSTSEC-2026-0194,RUSTSEC-2026-0195
