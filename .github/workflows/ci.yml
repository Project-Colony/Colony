name: CI

# A newer push to the same PR obsoletes the running build: cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch
        with:
          components: clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Format
        run: cargo fmt --all -- --check

      # --all-targets, or clippy never sees the 140 tests - the code most
      # likely to accumulate lint debt, since nobody reads it in review.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --verbose

  # The declared MSRV was 1.80 for years and could never have built: 70
  # transitive dependencies require more. Nothing checked it, because CI only
  # ever ran on stable. This leg is what stops it drifting again.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the declared MSRV
        id: msrv
        run: |
          version=$(grep '^rust-version' Cargo.toml | tr -d ' "' | cut -d= -f2)
          [ -n "$version" ] || { echo "::error::could not read rust-version from Cargo.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: msrv-${{ steps.msrv.outputs.version }}

      - name: Build on the declared floor
        run: cargo check --locked --all-targets

  # Colony downloads and executes binaries, so a known-vulnerable dependency is
  # not an abstract concern.
  #
  # continue-on-error because this REPORTS rather than gates: most advisories in
  # this tree arrive through the GUI stack and cannot be fixed here at all. The
  # standing example is quick-xml (RUSTSEC-2026-0194/0195), held at 0.38 by
  # wayland-scanner via winit and iced - and reached only as a build-time
  # proc-macro parsing the system's own Wayland protocol XML, never untrusted
  # input. Gating on that would block every unrelated fix until iced moves.
  #
  # Read the run output on every PR; act on anything reachable from network
  # input.
  audit:
    name: Advisories
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
