# Colony release workflow, from templates/sign-and-publish-caller.yml of
# Project-Colony-Resources.
#
# The build legs only build, check and upload artifacts; they never see a key.
# Authenticode (SignPath, once approved), ed25519 signing, verification and
# publishing all happen in .github/workflows/sign-and-publish.yml of
# Project-Colony-Resources, in this same run. The signing key is only ever in
# that workflow's own job, which checks out nothing and builds nothing. See
# design/releases.md, section "Shared signing workflow".
#
# On top of the template: a `target` job that refuses to rebuild a published
# release, a check of the Windows version resource, and the AUR bump once the
# release is public.
#
# Action refs are pinned to commit SHAs on purpose: this workflow can publish
# releases, and whoever can move a floating tag can change what it runs.

name: Release

on:
  push:
    branches: [main]
  # Recovery path. release-please only ever emits `release_created` once per
  # release, so once a tag exists "Re-run all jobs" makes release-please report
  # nothing to do and every job below skip, while the run goes green. That is
  # how v0.10.0 ended up tagged with an empty draft release. This input
  # finishes an existing DRAFT release whose run failed. Start it from the tag
  # ("Use workflow from: v0.10.0", or `gh workflow run release.yml --ref
  # v0.10.0 -f tag=v0.10.0`): with SignPath on, sign-and-publish refuses a run
  # whose commit is not the tag's, since SignPath records the run's commit as
  # the source of what it signs.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing draft release to build, sign and publish (e.g. v0.10.0). Run from that same tag."
        required: true
        type: string

# Each job asks for what it needs. The build legs run every dependency's build
# script, so they only get to read.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Assembles a release PR from the conventional commits since the last
  # release. Merging that PR is what creates the tag. Push only: on a recovery
  # dispatch the tag already exists, and running release-please would open or
  # update a release PR as a side effect of repairing an old release.
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # No `release-type` input: when it is set, the action ignores both files.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please publishes the release, and moves /releases/latest,
      # before any binary exists. For the whole build and sign window every
      # running Colony would show an update badge whose every click fails.
      # Held as a draft; sign-and-publish refuses anything else and publishes
      # it last. `-R` is not optional: this job has no checkout, so `gh` has no
      # git remote to infer the repository from, and a failure here once left
      # v0.10.0 published at /releases/latest with no assets at all.
      - name: Hold the release as a draft
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=true

  # One place that answers "which tag are we building?", so the jobs below do
  # not each have to know whether this run came from a merge or a dispatch.
  target:
    name: Resolve the target release
    needs: release-please
    # Runs on a merge that created a release, or on a recovery dispatch (when
    # release-please is skipped). NOT `always()`: that would also run this, and
    # everything after it, when release-please FAILED.
    if: ${{ !cancelled() && !failure() && (needs.release-please.outputs.release_created || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      # Only reads. But a draft release is invisible to a token without push
      # access, so with `contents: read` every draft looks like "no release".
      contents: write
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          # release-please's tag on a merge; the dispatch input on a recovery.
          # On a dispatch release-please is skipped and its outputs are empty,
          # so the fallback resolves in exactly one direction each time.
          FROM_RELEASE: ${{ needs.release-please.outputs.tag_name }}
          FROM_DISPATCH: ${{ inputs.tag }}
        run: |
          tag="${FROM_RELEASE:-$FROM_DISPATCH}"
          [ -n "$tag" ] || { echo "::error::no tag to build"; exit 1; }

          # Refuse to touch a release that is already visible to users:
          # replacing its live binaries would leave published assets whose .sig
          # and .meta describe bytes that no longer exist. Self-update is
          # fail-closed, so that breaks every install of that version.
          # sign-and-publish checks this again; failing here saves the builds.
          if ! gh release view "$tag" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft > /tmp/state 2>/dev/null; then
            echo "::error::no release found for $tag"
            exit 1
          fi
          if [ "$(cat /tmp/state)" != "true" ]; then
            echo "::error::$tag is already published. Re-running would overwrite its live assets and leave their signatures stale. Draft it first if you really mean to replace it: gh release edit $tag --draft=true"
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "building $tag (draft)"

  build:
    name: build ${{ matrix.asset }}
    needs: target
    # `!cancelled()` is load-bearing. A job `if:` with NO status-check function
    # gets an implicit `success()` ANDed onto it, and that `success()` covers
    # the whole ancestor graph, so on a recovery dispatch the skipped
    # `release-please` would skip this job too, even with `target` green. The
    # first v0.10.0 dispatch resolved the tag and then built nothing that way.
    if: ${{ !cancelled() && needs.target.result == 'success' }}
    # GitHub-hosted runners only: SignPath rejects a signing request if any
    # job leading to it ran on a self-hosted runner.
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset: colony-linux
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset: colony-windows.exe
          # "macos" is Apple Silicon, "macos-x86" is Intel. Colony picks
          # between them at runtime.
          - target: aarch64-apple-darwin
            os: macos-latest
            asset: colony-macos
          - target: x86_64-apple-darwin
            os: macos-latest
            asset: colony-macos-x86
    steps:
      # The tag, not the branch: a recovery dispatch must rebuild the tagged
      # commit, since the .meta sidecar binds these bytes to that version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.tag }}
          persist-credentials: false

      # Pinned to master with `toolchain: stable` rather than to the `stable`
      # branch: that branch is rebased onto every master commit, so a SHA
      # pinned on it stops being reachable from any branch.
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # No build cache here: SignPath forbids release builds that reuse
      # outputs of earlier, unverified builds.

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libdbus-1-dev

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Name the artifact (Unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/colony ${{ matrix.asset }}

      - name: Name the artifact (Windows)
        if: runner.os == 'Windows'
        run: copy target\${{ matrix.target }}\release\colony.exe ${{ matrix.asset }}

      # The signature proves provenance and says nothing about whether the
      # binary RUNS. An artifact built for the wrong architecture, or one that
      # aborts under the release profile's LTO, would otherwise be signed,
      # published, installed and hashed into the AUR PKGBUILD with every check
      # green. `--version` exits before opening a window.
      - name: Smoke-test the artifact
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          chmod +x "${{ matrix.asset }}" || true
          "./${{ matrix.asset }}" --version

      # SignPath signs only an .exe whose ProductName is the project name and
      # whose ProductVersion is set (build.rs embeds both). Checked against the
      # tag, so it also catches a Cargo.toml version that disagrees with it.
      # `-cne`: PowerShell's `-ne` ignores case.
      - name: Check the Windows version resource
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ASSET: ${{ matrix.asset }}
          TAG: ${{ needs.target.outputs.tag }}
        run: |
          $expected = $env:TAG -replace '^v', ''
          $info = (Get-Item $env:ASSET).VersionInfo
          "ProductName='$($info.ProductName)' ProductVersion='$($info.ProductVersion)' FileVersion='$($info.FileVersion)'"
          if ($info.ProductName -cne 'Colony' -or $info.ProductVersion -cne $expected) {
            "::error::$env:ASSET has ProductName '$($info.ProductName)' and ProductVersion '$($info.ProductVersion)', expected 'Colony' and '$expected'"
            exit 1
          }

      # The Intel macOS artifact is cross-compiled on an arm64 runner and
      # cannot be executed there, so assert its architecture instead: that is
      # the leg with the fewest users, where a regression survives longest.
      - name: Check the cross-compiled artifact's architecture
        if: matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          file "${{ matrix.asset }}"
          file "${{ matrix.asset }}" | grep -q 'x86_64' \
            || { echo "::error::${{ matrix.asset }} is not an x86_64 binary"; exit 1; }

      # The file at the artifact root, under its release name, and never to
      # the release from here: Authenticode rewrites the .exe, so nothing may
      # reach the release before every byte is final. The name prefix is what
      # `artifact-pattern` below matches.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1

  # Self-update verification is fail-closed: a release without .sig assets
  # bricks "Download update" for every existing install (v0.7.0 shipped
  # unsigned because signing was a manual step). In the same run as the
  # builds, chained by `needs:` rather than `on: release`: a release created
  # with the default GITHUB_TOKEN fires no release events, so a workflow
  # written that way never runs. The shared workflow fails the release if the
  # key is missing. Pinned to the organisation's commit of the shared
  # workflow; design/releases.md says when that pin moves.
  sign-and-publish:
    needs: [target, build]
    # Every dependency named explicitly. Guarding on `target` alone would let
    # this run after a FAILED build and try to sign assets that do not exist.
    if: ${{ !cancelled() && needs.target.result == 'success' && needs.build.result == 'success' }}
    # The ceiling for every job in the called workflow.
    permissions:
      actions: read
      contents: write
    uses: Project-Colony/Project-Colony-Resources/.github/workflows/sign-and-publish.yml@619460ff4dc0049f129955f0988d368427b9eedb # organisation pin
    with:
      tag: ${{ needs.target.outputs.tag }}
      # The four names self-update asks for (launcher_asset_name), each
      # published with its .sig, .meta and .meta.sig.
      assets: colony-linux colony-windows.exe colony-macos colony-macos-x86
      artifact-pattern: build-*
      # Uncomment once SignPath has approved this project and its project
      # exists in the Project-Colony SignPath organisation:
      # signpath-project-slug: "colony"
      # Leave the default `code-signing-policy: true` only while README.md has
      # a "## Code signing policy" section: the release notes link to it.
    # Named, not `inherit`: the called workflow gets these two and nothing else.
    secrets:
      COLONY_SIGNING_KEY_PEM: ${{ secrets.COLONY_SIGNING_KEY_PEM }}
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

  # Chained here (not on `release: published`) for the same reason as
  # sign-and-publish: the standalone trigger never fired once in nine
  # releases. Running after sign-and-publish also guarantees the assets are
  # signed and public before the AUR job hashes them.
  aur:
    name: Publish colony-bin to AUR
    needs: [target, sign-and-publish]
    # sign-and-publish too: without it, a failed signing job would still bump
    # the AUR package to a release that has no signatures.
    if: ${{ !cancelled() && needs.target.result == 'success' && needs.sign-and-publish.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/aur-publish.yml
    with:
      tag: ${{ needs.target.outputs.tag }}
    # NOT `inherit`: the AUR job needs one secret, and inheriting handed it
    # the release signing key as well.
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
