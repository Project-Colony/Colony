name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      upload_url: ${{ steps.release.outputs.upload_url }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          release-type: rust

      # release-please's own step PUBLISHES the release - and moves
      # /releases/latest - before a single binary exists. For the whole
      # build+sign window every running Colony therefore showed an update badge
      # whose every click failed: a missing asset first, then a fail-closed
      # signature refusal once `build` had uploaded but `sign` had not. And if
      # any build leg failed, that state was permanent until someone noticed.
      #
      # Held as a draft here rather than via a release-please config file: the
      # config-file route means switching the action to manifest mode, which
      # changes the outputs contract that the build, sign and aur jobs all
      # depend on and that nine releases have proven. This is one gh call, and
      # it narrows the window from minutes to the second between the two steps.
      - name: Hold the release as a draft until it is signed
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ steps.release.outputs.tag_name }}" --draft=true

  build:
    name: Build ${{ matrix.asset }}
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset: colony-linux
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset: colony-windows.exe
          - target: aarch64-apple-darwin
            os: macos-latest
            asset: colony-macos
          - target: x86_64-apple-darwin
            os: macos-latest
            asset: colony-macos-x86

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libdbus-1-dev

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/colony ${{ matrix.asset }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: copy target\${{ matrix.target }}\release\colony.exe ${{ matrix.asset }}

      # The pipeline's signature checks prove provenance and say nothing about
      # whether the binary RUNS. An asset built for the wrong architecture, or
      # one that aborts under the release profile's LTO, would be signed,
      # verified, published and hashed into the AUR PKGBUILD with every check
      # green. `--version` exits before opening a window, so this is a genuine
      # end-to-end smoke test of the shipped artefact.
      - name: Smoke-test the artefact
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          chmod +x "${{ matrix.asset }}" || true
          "./${{ matrix.asset }}" --version

      # The Intel macOS asset is cross-compiled on an arm64 runner and cannot
      # be executed there, so assert the architecture instead - which is the
      # regression that would otherwise survive longest, on the leg with the
      # fewest users.
      - name: Check the cross-compiled artefact's architecture
        if: matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          file "${{ matrix.asset }}"
          file "${{ matrix.asset }}" | grep -q 'x86_64' \
            || { echo "::error::${{ matrix.asset }} is not an x86_64 binary"; exit 1; }

      # `draft: true` is LOAD-BEARING, not a preference. Without it this action
      # calls finalizeRelease() after uploading, which PATCHes draft:false - so
      # the first matrix leg to finish would publish v0.10.0 as /releases/latest
      # carrying one of four binaries and zero signatures, and the sign job's
      # closing `--draft=false` would be a silent no-op. Every check would still
      # be green. That is the v0.7.0 incident, reached automatically.
      #
      # The action's own action.yml says it: "When reusing an existing draft
      # release, set this to true to keep it draft; omit it to publish after
      # upload." Verified in the pinned build: an absent input parses to
      # `undefined`, and the only guard is
      # `input_draft === true || release.draft === false`.
      - name: Upload binary to GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: ${{ matrix.asset }}
          draft: true

      # Assert the hold actually survived, so a future action bump cannot
      # silently reintroduce the above. Cheap, and it fails the leg rather than
      # the release.
      - name: The release must still be a draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          state=$(gh release view "$TAG" --json isDraft --jq .isDraft)
          [ "$state" = "true" ] || {
            echo "::error::$TAG is no longer a draft after upload - it is public without signatures. Re-draft it NOW: gh release edit $TAG --draft=true"
            exit 1
          }

  # Self-update verification is fail-closed: a release without .sig assets
  # bricks "Download update" for every existing install (this happened on
  # v0.7.0, which shipped unsigned because signing was a manual step). This job
  # makes the signatures part of the release itself and FAILS the release if
  # the signing secret is missing, so an unsigned release can never ship
  # silently again.
  sign:
    name: Sign release assets
    needs: [release-please, build]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    env:
      # Single source of truth for the four launcher assets. Declared once so the
      # download, sign, verify and post-upload steps cannot drift apart: a list
      # repeated per step means adding a platform silently leaves it unsigned,
      # which is exactly how v0.7.0 shipped.
      ASSETS: colony-linux colony-windows.exe colony-macos colony-macos-x86
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release binaries
        run: |
          mkdir dist
          for a in $ASSETS; do PATTERNS="$PATTERNS --pattern $a"; done
          gh release download "$TAG" --dir dist $PATTERNS
          for a in $ASSETS; do
            [ -s "dist/$a" ] || { echo "::error::release asset $a is missing or empty"; exit 1; }
          done

      - name: Sign
        env:
          KEY: ${{ secrets.COLONY_SIGNING_KEY_PEM }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::COLONY_SIGNING_KEY_PEM secret is not set - the release would ship unsigned and self-update is fail-closed. See docs/release-signing.md."
            exit 1
          fi
          printf '%s' "$KEY" > /tmp/colony-release.pem
          chmod 600 /tmp/colony-release.pem
          # The rm below is skipped when sign-release.sh exits non-zero under
          # `bash -e`, leaving the private key on the runner's disk for the rest
          # of the job.
          trap 'rm -f /tmp/colony-release.pem' EXIT
          for a in $ASSETS; do PATHS="$PATHS dist/$a"; done
          COLONY_SIGNING_KEY=/tmp/colony-release.pem \
          COLONY_RELEASE_VERSION="$TAG" \
            ./scripts/sign-release.sh $PATHS
          rm -f /tmp/colony-release.pem

      # Self-update is fail-closed on BOTH the signature and the signed metadata
      # sidecar that binds it to a version, so a release missing either one is
      # un-updatable. Check locally before uploading...
      - name: Verify every asset got a signature and a signed sidecar
        run: |
          for a in $ASSETS; do
            for required in "dist/$a.sig" "dist/$a.meta" "dist/$a.meta.sig"; do
              [ -s "$required" ] || { echo "::error::missing or empty $required"; exit 1; }
            done
            grep -qx "version=$TAG" "dist/$a.meta" \
              || { echo "::error::dist/$a.meta does not bind version=$TAG"; exit 1; }
            grep -qx "asset=$a" "dist/$a.meta" \
              || { echo "::error::dist/$a.meta does not bind asset=$a"; exit 1; }
          done
          echo "all assets carry .sig + .meta + .meta.sig, correctly bound"

      - name: Upload signatures and metadata
        run: gh release upload "$TAG" dist/*.sig dist/*.meta --clobber

      # ...and again against the PUBLISHED release, because a local file proves
      # nothing about what users can actually download.
      - name: Verify the published release carries every asset
        run: |
          gh release view "$TAG" --json assets --jq '.assets[].name' | sort > /tmp/published
          for a in $ASSETS; do
            for required in "$a" "$a.sig" "$a.meta" "$a.meta.sig"; do
              grep -qx "$required" /tmp/published \
                || { echo "::error::$required is not published on $TAG - self-update would refuse this release"; exit 1; }
            done
          done
          echo "published release verified"

      # Only now does the release become visible. Until this step, /releases/
      # latest still points at the previous version, so no client is offered an
      # update it cannot apply, and the README's download link never points at
      # an empty release.
      - name: Publish the release
        run: gh release edit "$TAG" --draft=false

  # Chained here (not on `release: published`) because release-please creates
  # the release with the default GITHUB_TOKEN, whose events do not trigger
  # other workflows - the standalone trigger never fired once in nine
  # releases. Running after `sign` also guarantees the assets exist before
  # the AUR job hashes them.
  aur:
    name: Publish colony-bin to AUR
    needs: [release-please, sign]
    if: ${{ needs.release-please.outputs.release_created }}
    uses: ./.github/workflows/aur-publish.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    # NOT `inherit`: the AUR job needs one secret, and inheriting handed it
    # the release signing key as well.
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
