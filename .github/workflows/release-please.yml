name: Release

on:
  push:
    branches: [main]
  # Recovery path. release-please only ever emits `release_created` once per
  # release, so once a tag exists there is no way to re-run build and sign for
  # it: "Re-run all jobs" makes release-please report nothing to do and every
  # downstream job skip, while the run goes green. That is how v0.10.0 ended up
  # tagged with an empty draft release and no way to finish it.
  #
  # Dispatch with the tag to build, sign and publish an existing DRAFT release,
  # and start it FROM that tag: `gh workflow run release-please.yml --ref
  # v0.10.0 -f tag=v0.10.0`. Once SignPath is on, sign-and-publish refuses a run
  # whose commit is not the tag's, since SignPath records the run's commit as
  # the source of what it signs.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build, sign and publish (e.g. v0.10.0)'
        required: true
        type: string

# Each job asks for what it needs. The build legs run every dependency's build
# script, so they only get to read.
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      upload_url: ${{ steps.release.outputs.upload_url }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          release-type: rust

      # release-please's own step PUBLISHES the release - and moves
      # /releases/latest - before a single binary exists. For the whole
      # build+sign window every running Colony therefore showed an update badge
      # whose every click failed: a missing asset first, then a fail-closed
      # signature refusal once `build` had uploaded but `sign` had not. And if
      # any build leg failed, that state was permanent until someone noticed.
      #
      # Held as a draft by this one gh call, which narrows the window from
      # minutes to the second between the two steps. release-please's own
      # `draft` setting lives in a config file, and the action ignores config
      # files whenever `release-type` is set, as it is here.
      - name: Hold the release as a draft until it is signed
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
        # `-R` is not optional: this job has no `actions/checkout`, so `gh`
        # has no git remote to infer the repository from and dies with
        # "fatal: not a git repository". aur-publish.yml already carries this
        # exact warning; this call was added without heeding it, and the cost
        # was a published, empty v0.10.0 sitting at /releases/latest.
        run: gh release edit "${{ steps.release.outputs.tag_name }}" -R "${{ github.repository }}" --draft=true

  # One place that answers "which tag are we building?", so the jobs below do
  # not each have to know whether this run came from a merge or a dispatch.
  target:
    name: Resolve the target release
    needs: release-please
    # NOT `always()`: that would also run this - and everything after it - when
    # release-please FAILED, which is the brake that stopped the v0.10.0
    # incident from going further than an empty draft. `!cancelled() &&
    # !failure()` still lets the job run when release-please is SKIPPED, which
    # is what a workflow_dispatch does.
    if: ${{ !cancelled() && !failure() && (needs.release-please.outputs.release_created || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      # Only reads. But a draft release is invisible to a token without push
      # access, so with `contents: read` every draft looks like "no release".
      contents: write
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          # release-please's tag on a merge; the dispatch input on a recovery.
          # On a dispatch release-please is skipped and its outputs are empty,
          # so the fallback resolves in exactly one direction each time.
          FROM_RELEASE: ${{ needs.release-please.outputs.tag_name }}
          FROM_DISPATCH: ${{ inputs.tag }}
        run: |
          tag="${FROM_RELEASE:-$FROM_DISPATCH}"
          [ -n "$tag" ] || { echo "::error::no tag to build"; exit 1; }

          # Refuse to touch a release that is already visible to users:
          # replacing its live binaries would leave published assets whose .sig
          # and .meta describe bytes that no longer exist. Self-update is
          # fail-closed, so that breaks every install of that version.
          # sign-and-publish checks this again; failing here saves the builds.
          if ! gh release view "$tag" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft > /tmp/state 2>/dev/null; then
            echo "::error::no release found for $tag"
            exit 1
          fi
          if [ "$(cat /tmp/state)" != "true" ]; then
            echo "::error::$tag is already published. Re-running would overwrite its live assets and leave their signatures stale. Draft it first if you really mean to replace it: gh release edit $tag --draft=true"
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "building $tag (draft)"

  build:
    name: Build ${{ matrix.asset }}
    needs: target
    # Explicit, because a SKIPPED job propagates transitively: `target` runs on
    # a dispatch thanks to its own status-function `if:`, but that does not
    # clear the skip inherited from `release-please` for the jobs after it.
    # Without this, a recovery dispatch resolves the tag and then silently
    # builds nothing - which is exactly what the first v0.10.0 dispatch did.
    # `!cancelled()` is load-bearing, not decoration. A job `if:` containing NO
    # status-check function gets an implicit `success()` ANDed onto it, and that
    # `success()` accounts for the whole ancestor graph - so the skipped
    # `release-please` made it false and this job skipped even though its own
    # condition was true and its direct dependency had succeeded. Naming any
    # status function suppresses the implicit one.
    if: ${{ !cancelled() && needs.target.result == 'success' }}
    # GitHub-hosted runners only: SignPath rejects a signing request if any job
    # leading to it ran on a self-hosted runner.
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset: colony-linux
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset: colony-windows.exe
          - target: aarch64-apple-darwin
            os: macos-latest
            asset: colony-macos
          - target: x86_64-apple-darwin
            os: macos-latest
            asset: colony-macos-x86

    steps:
      # Check out the TAG, not the branch. On a recovery dispatch the default
      # ref is the branch the workflow was dispatched from, so without this the
      # rebuild would produce binaries from a different commit than the one the
      # tag names - and the .meta sidecar binds those bytes to that version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.tag }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch
        with:
          targets: ${{ matrix.target }}

      # No build cache here: SignPath forbids release builds that reuse
      # outputs of earlier, unverified builds.

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libdbus-1-dev

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/colony ${{ matrix.asset }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: copy target\${{ matrix.target }}\release\colony.exe ${{ matrix.asset }}

      # The pipeline's signature checks prove provenance and say nothing about
      # whether the binary RUNS. An asset built for the wrong architecture, or
      # one that aborts under the release profile's LTO, would be signed,
      # verified, published and hashed into the AUR PKGBUILD with every check
      # green. `--version` exits before opening a window, so this is a genuine
      # end-to-end smoke test of the shipped artefact.
      - name: Smoke-test the artefact
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          chmod +x "${{ matrix.asset }}" || true
          "./${{ matrix.asset }}" --version

      # SignPath signs only an .exe whose ProductName is the project name and
      # whose ProductVersion is set (build.rs embeds both). Checked against the
      # tag, so it also catches a Cargo.toml version that disagrees with it.
      # `-cne`: PowerShell's `-ne` ignores case.
      - name: Check the Windows version resource
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ASSET: ${{ matrix.asset }}
          TAG: ${{ needs.target.outputs.tag }}
        run: |
          $expected = $env:TAG -replace '^v', ''
          $info = (Get-Item $env:ASSET).VersionInfo
          "ProductName='$($info.ProductName)' ProductVersion='$($info.ProductVersion)' FileVersion='$($info.FileVersion)'"
          if ($info.ProductName -cne 'Colony' -or $info.ProductVersion -cne $expected) {
            "::error::$env:ASSET has ProductName '$($info.ProductName)' and ProductVersion '$($info.ProductVersion)', expected 'Colony' and '$expected'"
            exit 1
          }

      # The Intel macOS asset is cross-compiled on an arm64 runner and cannot
      # be executed there, so assert the architecture instead - which is the
      # regression that would otherwise survive longest, on the leg with the
      # fewest users.
      - name: Check the cross-compiled artefact's architecture
        if: matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          file "${{ matrix.asset }}"
          file "${{ matrix.asset }}" | grep -q 'x86_64' \
            || { echo "::error::${{ matrix.asset }} is not an x86_64 binary"; exit 1; }

      # To sign-and-publish as an artifact, at its root and under its release
      # name, and never to the release from here: Authenticode rewrites the
      # .exe, so nothing may reach the release before every byte is final.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1

  # Self-update verification is fail-closed: a release without .sig assets
  # bricks "Download update" for every existing install (this happened on
  # v0.7.0, which shipped unsigned because signing was a manual step). The
  # organisation's shared workflow, in this same run: Authenticode through
  # SignPath for the .exe (once SignPath is on), then .sig, .meta and .meta.sig
  # over the FINAL bytes with COLONY_SIGNING_KEY_PEM, upload to the draft,
  # download again and verify, and only then publish. It fails the release if
  # the key is missing, so an unsigned release can never ship silently.
  # Pinned by SHA: it holds the release key. See design/releases.md, section
  # "Shared signing workflow", in Project-Colony-Resources.
  sign-and-publish:
    needs: [target, build]
    # Every dependency named explicitly. Guarding on `target` alone would let
    # this run after a FAILED build and try to sign assets that do not exist.
    if: ${{ !cancelled() && needs.target.result == 'success' && needs.build.result == 'success' }}
    # The ceiling for every job in the called workflow.
    permissions:
      actions: read
      contents: write
    uses: Project-Colony/Project-Colony-Resources/.github/workflows/sign-and-publish.yml@619460ff4dc0049f129955f0988d368427b9eedb # main
    with:
      tag: ${{ needs.target.outputs.tag }}
      # The four names self-update asks for (launcher_asset_name), each
      # published with its .sig, .meta and .meta.sig.
      assets: colony-linux colony-windows.exe colony-macos colony-macos-x86
      artifact-pattern: build-*
      # Uncomment once SignPath has approved this project and its project
      # exists in the Project-Colony SignPath organisation:
      # signpath-project-slug: "colony"
    # Named, not `inherit`: the called workflow gets these two and nothing else.
    secrets:
      COLONY_SIGNING_KEY_PEM: ${{ secrets.COLONY_SIGNING_KEY_PEM }}
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

  # Chained here (not on `release: published`) because release-please creates
  # the release with the default GITHUB_TOKEN, whose events do not trigger
  # other workflows - the standalone trigger never fired once in nine
  # releases. For the same reason the publish inside sign-and-publish, made
  # with GITHUB_TOKEN, would not start it either. Running after
  # sign-and-publish also guarantees the assets are signed and public before
  # the AUR job hashes them.
  aur:
    name: Publish colony-bin to AUR
    needs: [target, sign-and-publish]
    # sign-and-publish too: without it, a failed signing job would still bump
    # the AUR package to a release that has no signatures.
    if: ${{ !cancelled() && needs.target.result == 'success' && needs.sign-and-publish.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/aur-publish.yml
    with:
      tag: ${{ needs.target.outputs.tag }}
    # NOT `inherit`: the AUR job needs one secret, and inheriting handed it
    # the release signing key as well.
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
