[package]
name = "colony"
version = "0.10.4"
description = "Launcher and app store for Project Colony programs"
repository = "https://github.com/Project-Colony/Colony"
edition = "2021"
license = "GPL-3.0-or-later"
# The real floor, and it is enforced by CI (see .github/workflows/ci.yml).
# 1.80 was declared for years and could never have worked: 70 transitive
# dependencies require more, including iced, zip, image and wgpu at 1.88, so
# cargo refuses to build at all on it. Nothing checked, because CI only ever
# ran on stable.
rust-version = "1.88"
# MSRV-aware resolution: `cargo update` picks the newest release of each crate
# that still builds on `rust-version`, so a transitive dependency cannot raise
# the floor by accident.
resolver = "3"

[dependencies]
anyhow = "1.0.104"
# The shared theme, palettes, accents, labels and widgets, generated from the
# design tokens in Project-Colony-Resources.
colony-ui = "0.1.6"
iced = { version = "0.14.0", features = ["tokio", "markdown", "advanced", "image-without-codecs"] }
shell-words = "1.1.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.8"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "stream", "rustls", "http2", "charset", "system-proxy"] }
tokio = { version = "1.53.2", features = ["sync", "time", "rt"] }
futures = "0.3.34"
open = "5.4.4"
base64 = "0.23.1"
dirs = "7.0.0"
# The GitHub token goes to the OS credential store through keyring 4, which is
# keyring-core plus one store crate per OS (the target tables below). keyring 3
# fell back to an in-memory mock whenever a platform feature was missing: its
# set_password returned Ok while storing nothing, Colony deleted the plaintext
# fallback on that Ok, and every restart logged the user out. keyring-core has
# no implicit store at all. Colony never sets a default store and builds every
# entry from the per-target store in src/oauth.rs, so the mock is reachable only
# from the tests, and the plaintext copy goes only after the token reads back.
keyring-core = "1.0.0"
semver = "1.0.28"
sha2 = "0.11.0"
# Pure-Rust ed25519 verification for signed launcher self-updates (no openssl).
ed25519-dalek = { version = "3.0.0", default-features = false }
zip = { version = "9.0.0", default-features = false, features = ["deflate"] }
tar = "0.4.46"
flate2 = "1.1.10"
# PNG-only decoder for per-app icons (no other codecs); pairs with iced's
# image-without-codecs to render decoded RGBA. Keeps the image stack minimal.
image = { version = "0.25.10", default-features = false, features = ["png"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# One credential store per OS, each gated to its own target so a build pulls in
# only its own. The stores use the same service, account and Windows target name
# as keyring 3, so a token saved before the upgrade is still read.
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1.1.0"

# Secret Service over libdbus, as with keyring 3. `vendored` builds libdbus from
# source so no system headers are needed; `crypto-rust` encrypts the session
# without openssl.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
dbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust", "vendored"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.fast]
inherits = "release"
debug = "line-tables-only"
incremental = true
lto = false
codegen-units = 16
strip = false

[dev-dependencies]
tempfile = "3.27.0"

# Embeds the Windows version resource (build.rs). Without default features it
# pulls in nothing but version_check, and it does nothing on other targets.
[build-dependencies]
winresource = { version = "0.1.31", default-features = false }
